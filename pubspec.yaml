name: primware
description: "Sales app fully integrated with iDempiere ERP."
publish_to: "none"
version: 1.0.32+72

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.3
  top_snackbar_flutter: ^3.2.0
  intl: ^0.20.2
  dropdown_search: ^6.0.2
  flutter_launcher_icons: ^0.14.3
  shimmer: ^3.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.1
  http: ^1.4.0
  searchfield: ^2.0.0
  flutter_localization: ^0.3.3
  qr_flutter: ^4.1.0
  toastification: ^3.0.3
  image_picker: ^1.2.0
  package_info_plus: ^9.0.0
  flutter_native_splash: ^2.4.6
  fluttertoast: ^9.0.0
  graphic: ^2.7.0
  fl_chart: ^0.68.0
  image_cropper: ^12.2.1
  app_links: ^7.0.0
  protocol_handler: ^0.2.0

flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/img/icono.png"
    background_color: "#FAFAFA"
    theme_color: "#FAFAFA"
  android: "launcher_icon"
  ios: true
  ios_icon_name: AppIcon
  remove_alpha_ios: true
  image_path: "assets/img/icono.png"
  macos:
    generate: true
    image_path: "assets/img/icono.png"
  windows:
    generate: true
    image_path: "assets/img/icono.png"
    icon_size: 48

flutter_native_splash:
  ios: true
  android: false
  color: "#FAFAFA"
  image: assets/img/icono.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/img/
